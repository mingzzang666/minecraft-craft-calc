<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마인크래프트 제작 계산기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosepink: {
                            50: '#fff5f8',
                            100: '#ffe6f0',
                            200: '#fbcfe3',
                            300: '#f7a8ca',
                            400: '#f27ba8',
                            500: '#e83e6b',
                            600: '#d62657',
                        },
                        smokedark: {
                            800: '#1e1c1f',
                            850: '#181619',
                            900: '#141215',
                            950: '#0d0c0e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d0c0e;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #181619;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f27ba8;
            border-radius: 3px;
        }
        .active-tab {
            background-color: rgba(242, 123, 168, 0.2) !important;
            color: #f7a8ca !important;
            border: 1px solid rgba(242, 123, 168, 0.5) !important;
        }
    </style>
</head>
<body class="min-h-screen pb-12 custom-scrollbar">
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center text-3xl mb-2 text-rosepink-300">
                <i class="fa-solid fa-cube mr-3"></i>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">마인크래프트 제작 계산기</h1>
            </div>
            <p class="text-gray-400 text-sm">완성품 수량 기준 또는 보유 핵심 광물 기준으로 재료를 빠르게 계산합니다.</p>
        </header>

        <!-- Mode Selection Tabs -->
        <div class="flex justify-center mb-8 gap-2 bg-smokedark-800 p-1.5 rounded-xl border border-rosepink-500/20 max-w-md mx-auto">
            <button id="tabTargetBtn" onclick="switchMainTab('target')" class="flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-rosepink-500 text-white shadow-lg shadow-rosepink-500/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bullseye"></i> 완성품 제작 수량 기준
            </button>
            <button id="tabStockBtn" onclick="switchMainTab('stock')" class="flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-gray-400 hover:text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-gem"></i> 핵심 광물 보유량 기준
            </button>
        </div>

        <!-- Tab 1: 완성품 기준 입력 -->
        <div id="targetSection" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 라이프스톤 카드 -->
                <div class="bg-smokedark-800/80 border border-smokedark-800 rounded-2xl p-5 shadow-xl">
                    <h2 class="text-lg font-semibold text-rosepink-300 mb-4 flex items-center gap-2 border-b border-gray-800 pb-2">
                        <i class="fa-solid fa-heart-pulse text-rosepink-400"></i> 라이프스톤
                    </h2>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">하급 라이프스톤</label>
                            <input type="number" id="target_하급 라이프스톤" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">중급 라이프스톤</label>
                            <input type="number" id="target_중급 라이프스톤" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">상급 라이프스톤</label>
                            <input type="number" id="target_상급 라이프스톤" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                    </div>
                </div>

                <!-- 형광 제련품 카드 -->
                <div class="bg-smokedark-800/80 border border-smokedark-800 rounded-2xl p-5 shadow-xl">
                    <h2 class="text-lg font-semibold text-rosepink-300 mb-4 flex items-center gap-2 border-b border-gray-800 pb-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-rosepink-400"></i> 형광 제련품
                    </h2>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">오르딘</label>
                            <input type="number" id="target_오르딘" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">루미트</label>
                            <input type="number" id="target_루미트" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">크레온</label>
                            <input type="number" id="target_크레온" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">벨릭</label>
                            <input type="number" id="target_벨릭" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-sm text-gray-300 font-medium">세르칸</label>
                            <input type="number" id="target_세르칸" min="0" value="0" oninput="calculateFromTarget()" class="w-24 bg-smokedark-900 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: 핵심 광물 보유량 기준 입력 -->
        <div id="stockSection" class="space-y-6 hidden">
            <div class="bg-smokedark-800/80 border border-smokedark-800 rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-800">
                    <h2 class="text-lg font-semibold text-rosepink-300 flex items-center gap-2">
                        <i class="fa-solid fa-gem text-rosepink-400"></i> 핵심 광물 보유 개수
                    </h2>
                    <span class="text-xs text-gray-400 bg-smokedark-900 px-2.5 py-1 rounded-full border border-gray-800">보유 광물 기준 계산</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">코룸</label>
                        <input type="number" id="stock_코룸" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">리프톤</label>
                        <input type="number" id="stock_리프톤" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">세렌트</label>
                        <input type="number" id="stock_세렌트" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">오르딘</label>
                        <input type="number" id="stock_오르딘" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">루미트</label>
                        <input type="number" id="stock_루미트" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">크레온</label>
                        <input type="number" id="stock_크레온" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">벨릭</label>
                        <input type="number" id="stock_벨릭" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                    <div class="bg-smokedark-900/60 p-3 rounded-xl border border-gray-800/80">
                        <label class="block text-xs font-semibold text-purple-300 mb-1">세르칸</label>
                        <input type="number" id="stock_세르칸" min="0" value="0" oninput="calculateFromStock()" class="w-full bg-smokedark-950 border border-gray-700 rounded-lg px-3 py-1.5 text-right font-semibold text-rosepink-300 focus:outline-none focus:border-rosepink-400 transition">
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Card Area -->
        <div id="resultCard" class="mt-8 bg-smokedark-800/90 border border-smokedark-800 rounded-2xl p-5 md:p-6 shadow-2xl backdrop-blur-sm transition-all duration-300 hidden">
            
            <!-- 제작 가능 완성품 요약 (핵심 광물 보유량 모드일 때만 노출) -->
            <div id="craftSummaryCard" class="mb-6 p-4 bg-smokedark-900/90 border border-rosepink-500/30 rounded-xl hidden">
                <h3 class="text-xs font-bold text-rosepink-300 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-hammer"></i> 완성품 제작 가능 수량
                </h3>
                <div id="craftSummaryList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm font-medium">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- 결과 헤더 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-gray-800">
                <div>
                    <h2 class="text-xl font-bold text-rosepink-300 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-packing text-rosepink-400"></i> 필요 나머지 재료 결과
                    </h2>
                    <p class="text-xs text-gray-400 mt-0.5">상자/인벤토리에서 꺼내기 편하게 카테고리별로 정렬된 목록입니다.</p>
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <span class="bg-rosepink-950/60 text-rosepink-300 border border-rosepink-800/50 px-2.5 py-1 rounded-full font-medium" id="totalItemsBadge">0종류 재료</span>
                    <button id="resetCheckmarksBtn" onclick="resetCheckmarks()" class="bg-smokedark-900 hover:bg-gray-800 text-gray-300 px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1 border border-gray-700">
                        <i class="fa-solid fa-rotate-left text-[10px]"></i> 체크 초기화
                    </button>
                </div>
            </div>

            <!-- 카테고리 탭 UI -->
            <div class="flex flex-wrap gap-1.5 p-1 bg-smokedark-950 rounded-xl border border-gray-800 mb-5" id="categoryTabs">
                <button data-tab="all" onclick="filterCategoryTab('all')" class="tab-btn active-tab flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-semibold text-center transition-all flex items-center justify-center gap-1.5 text-rosepink-300">
                    <i class="fa-solid fa-list-ul"></i> 전체 보기
                </button>
                <button data-tab="rare" onclick="filterCategoryTab('rare')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-semibold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-rosepink-200">
                    <span>💎</span> 귀중 광물
                </button>
                <button data-tab="main" onclick="filterCategoryTab('main')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-semibold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-rosepink-200">
                    <span>⛏️</span> 주요 광물/블록
                </button>
                <button data-tab="misc" onclick="filterCategoryTab('misc')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-semibold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-rosepink-200">
                    <span>📦</span> 기타/일반 재료
                </button>
            </div>

            <!-- 결과 그룹 컨테이너 -->
            <div id="resultGroupsContainer" class="space-y-6">
                <!-- JavaScript로 동적 생성됨 -->
            </div>
        </div>
    </div>

    <script>
        // 마인크래프트 조합법 정의 (수정된 개수 및 명칭 반영)
        const RECIPES = {
            "하급 라이프스톤": { "조약돌 뭉치": 2, "구리 블록": 8, "레드스톤 블록": 3, "코룸": 1 },
            "중급 라이프스톤": { "심층암 조약돌 뭉치": 2, "청금석 블록": 5, "철 블록": 5, "다이아몬드 블록": 3, "리프톤": 2 },
            "상급 라이프스톤": { "구리 블록": 30, "자수정 블록": 20, "철 블록": 7, "금 블록": 7, "다이아몬드 블록": 5, "세렌트": 3 },
            "오르딘": { "오르딘": 1, "사파이어 블록": 1, "스킬 펄스": 1, "다이아몬드": 4, "철 블록": 2, "안산암": 32 },
            "루미트": { "루미트": 1, "토파즈 블록": 1, "스킬 펄스": 1, "꽁꽁 언 얼음": 8, "청금석 블록": 8, "응회암": 32 },
            "크레온": { "크레온": 1, "플래티넘 블록": 1, "스킬 펄스": 2, "테라코타": 16, "금 블록": 2, "레드스톤 블록": 8 },
            "벨릭": { "벨릭": 1, "토파즈 블록": 3, "스킬 펄스": 3, "네더 석영": 32, "네더랙": 32, "석탄 블록": 8 },
            "세르칸": { "세르칸": 1, "플래티넘 블록": 5, "스킬 펄스": 5, "에메랄드": 2, "이끼 블록": 24, "구리 블록": 16 }
        };

        // 핵심 광물별 매핑 (필요 핵심 광물 수량)
        const CORE_MINERAL_MAP = {
            "코룸": { item: "하급 라이프스톤", req: 1 },
            "리프톤": { item: "중급 라이프스톤", req: 2 },
            "세렌트": { item: "상급 라이프스톤", req: 3 },
            "오르딘": { item: "오르딘", req: 1 },
            "루미트": { item: "루미트", req: 1 },
            "크레온": { item: "크레온", req: 1 },
            "벨릭": { item: "벨릭", req: 1 },
            "세르칸": { item: "세르칸", req: 1 }
        };

        // 카테고리 매핑
        const CATEGORY_MAP = {
            rare: {
                title: "💎 귀중 및 특수 광물",
                badgeColor: "bg-purple-950/60 text-purple-300 border-purple-800/50",
                headerColor: "text-purple-300",
                items: ["토파즈 블록", "사파이어 블록", "플래티넘 블록", "코룸", "리프톤", "세렌트"]
            },
            main: {
                title: "⛏️ 주요 광물 및 블록",
                badgeColor: "bg-blue-950/60 text-blue-300 border-blue-800/50",
                headerColor: "text-blue-300",
                items: ["구리 블록", "철 블록", "금 블록", "레드스톤 블록", "청금석 블록", "다이아몬드", "에메랄드", "자수정 블록"]
            },
            misc: {
                title: "📦 기타 및 일반 재료",
                badgeColor: "bg-emerald-950/60 text-emerald-300 border-emerald-800/50",
                headerColor: "text-emerald-300",
                items: []
            }
        };

        let activeMainTab = 'target';
        let currentCategoryTab = 'all';
        let checkedState = {};
        let previousQuantities = {};

        // 메인 탭 전환 함수
        function switchMainTab(tab) {
            activeMainTab = tab;
            const targetBtn = document.getElementById('tabTargetBtn');
            const stockBtn = document.getElementById('tabStockBtn');
            const targetSec = document.getElementById('targetSection');
            const stockSec = document.getElementById('stockSection');

            if (tab === 'target') {
                targetBtn.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-rosepink-500 text-white shadow-lg shadow-rosepink-500/20 flex items-center justify-center gap-2";
                stockBtn.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-gray-400 hover:text-white flex items-center justify-center gap-2";
                targetSec.classList.remove('hidden');
                stockSec.classList.add('hidden');
                calculateFromTarget();
            } else {
                stockBtn.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 bg-rosepink-500 text-white shadow-lg shadow-rosepink-500/20 flex items-center justify-center gap-2";
                targetBtn.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition-all duration-200 text-gray-400 hover:text-white flex items-center justify-center gap-2";
                stockSec.classList.remove('hidden');
                targetSec.classList.add('hidden');
                calculateFromStock();
            }
        }

        // 카테고리 탭 클릭 필터링
        function filterCategoryTab(tabKey) {
            currentCategoryTab = tabKey;
            document.querySelectorAll('#categoryTabs .tab-btn').forEach(btn => {
                btn.classList.remove('active-tab', 'text-rosepink-300');
                btn.classList.add('text-gray-400');
            });

            const activeBtn = document.querySelector(`#categoryTabs [data-tab="${tabKey}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active-tab', 'text-rosepink-300');
                activeBtn.classList.remove('text-gray-400');
            }

            const groups = document.querySelectorAll('.category-group');
            groups.forEach(group => {
                if (currentCategoryTab === 'all' || group.classList.contains(`category-${currentCategoryTab}`)) {
                    group.classList.remove('hidden');
                } else {
                    group.classList.add('hidden');
                }
            });
        }

        function getCategoryKey(itemName) {
            const name = itemName.trim();
            if (CATEGORY_MAP.rare.items.some(k => name.includes(k))) return 'rare';
            if (CATEGORY_MAP.main.items.some(k => name.includes(k))) return 'main';
            return 'misc';
        }

        // 완성품 수량 기준 계산
        function calculateFromTarget() {
            const materialsMap = {};
            for (const [itemName, recipe] of Object.entries(RECIPES)) {
                const inputEl = document.getElementById(`target_${itemName}`);
                const count = parseInt(inputEl ? inputEl.value : 0) || 0;
                if (count > 0) {
                    for (const [mat, qty] of Object.entries(recipe)) {
                        materialsMap[mat] = (materialsMap[mat] || 0) + (qty * count);
                    }
                }
            }
            renderResults(materialsMap, null);
        }

        // 핵심 광물 보유량 기준 계산
        function calculateFromStock() {
            const materialsMap = {};
            const craftsSummary = [];

            for (const [mineral, info] of Object.entries(CORE_MINERAL_MAP)) {
                const inputEl = document.getElementById(`stock_${mineral}`);
                const mineralCount = parseInt(inputEl ? inputEl.value : 0) || 0;

                if (mineralCount > 0) {
                    const craftsPossible = Math.floor(mineralCount / info.req);
                    if (craftsPossible > 0) {
                        craftsSummary.push({ item: info.item, count: craftsPossible });
                        const recipe = RECIPES[info.item];
                        for (const [mat, qty] of Object.entries(recipe)) {
                            // 핵심 광물 자체는 결과에서 제외 (이미 보유 중이므로)
                            if (mat !== mineral) {
                                materialsMap[mat] = (materialsMap[mat] || 0) + (qty * craftsPossible);
                            }
                        }
                    }
                }
            }
            renderResults(materialsMap, craftsSummary);
        }

        // 마인크래프트 세트(64개) 표기 변환 함수
        function formatStackText(qty) {
            const stacks = Math.floor(qty / 64);
            const rem = qty % 64;
            if (stacks > 0 && rem > 0) {
                return `<span class="text-rosepink-300 font-semibold">${stacks}세트 + ${rem}개</span> <span class="text-gray-500 text-[11px] font-normal">(총 ${qty}개)</span>`;
            } else if (stacks > 0 && rem === 0) {
                return `<span class="text-rosepink-300 font-semibold">${stacks}세트</span> <span class="text-gray-500 text-[11px] font-normal">(총 ${qty}개)</span>`;
            } else {
                return `<span class="text-rosepink-300 font-semibold">${qty}개</span>`;
            }
        }

        // 결과 영역 랜더링
        function renderResults(materialsMap, craftsSummary) {
            // 필요 개수가 변경되었거나 더 이상 필요 없는 재료만 체크 해제 (개수가 동일한 재료는 체크 유지)
            for (const [matName, isChecked] of Object.entries(checkedState)) {
                if (!isChecked) continue;
                const newCount = materialsMap[matName] || 0;
                const oldCount = previousQuantities[matName] || 0;
                if (newCount !== oldCount || newCount === 0) {
                    checkedState[matName] = false;
                }
            }
            previousQuantities = { ...materialsMap };

            const resultCard = document.getElementById('resultCard');
            const container = document.getElementById('resultGroupsContainer');
            const badge = document.getElementById('totalItemsBadge');
            const summaryCard = document.getElementById('craftSummaryCard');
            const summaryList = document.getElementById('craftSummaryList');

            container.innerHTML = '';
            summaryList.innerHTML = '';

            // 1. 제작 가능 요약 카드 랜더링 (보유량 모드 전용)
            if (craftsSummary && craftsSummary.length > 0) {
                summaryCard.classList.remove('hidden');
                craftsSummary.forEach(c => {
                    const stackFmt = formatStackText(c.count);
                    const div = document.createElement('div');
                    div.className = "bg-smokedark-950/80 px-3 py-2 rounded-lg border border-gray-800 flex justify-between items-center";
                    div.innerHTML = `<span class="text-gray-300">${c.item}</span> <span>${stackFmt}</span>`;
                    summaryList.appendChild(div);
                });
            } else {
                summaryCard.classList.add('hidden');
            }

            const entries = Object.entries(materialsMap);

            if (entries.length === 0) {
                resultCard.classList.add('hidden');
                return;
            }

            resultCard.classList.remove('hidden');
            badge.textContent = `${entries.length}종류 재료`;

            // 카테고리별 데이터 그룹화
            const groupedData = { rare: [], main: [], misc: [] };
            entries.forEach(([name, count]) => {
                const catKey = getCategoryKey(name);
                groupedData[catKey].push({ name, count });
            });

            // 카테고리별 카드 랜더링
            ['rare', 'main', 'misc'].forEach(key => {
                const group = groupedData[key];
                if (group.length === 0) return;

                const catInfo = CATEGORY_MAP[key];

                const groupWrapper = document.createElement('div');
                groupWrapper.className = `category-group category-${key} space-y-2.5 transition-all duration-300`;
                
                groupWrapper.innerHTML = `
                    <div class="flex items-center justify-between pb-1 border-b border-gray-800">
                        <h3 class="text-sm font-semibold ${catInfo.headerColor} flex items-center gap-2">
                            ${catInfo.title}
                        </h3>
                        <span class="text-[11px] px-2 py-0.5 rounded-full border ${catInfo.badgeColor}">${group.length}개 항목</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                        ${group.map(item => createMaterialCardHtml(item.name, item.count)).join('')}
                    </div>
                `;

                container.appendChild(groupWrapper);
            });

            filterCategoryTab(currentCategoryTab);
        }

        // 단일 재료 아이템 카드 HTML 생성
        function createMaterialCardHtml(name, count) {
            const isChecked = checkedState[name] || false;
            const stackFormatted = formatStackText(count);

            return `
                <div onclick="toggleCheck('${name}', this)" class="material-item bg-smokedark-850 hover:bg-smokedark-800 border border-gray-800 rounded-xl p-3 flex items-center justify-between cursor-pointer transition select-none group ${isChecked ? 'opacity-40 bg-smokedark-900 border-gray-900' : ''}">
                    <div class="flex items-center gap-3">
                        <div class="check-box w-5 h-5 rounded-md border ${isChecked ? 'bg-rosepink-500 border-rosepink-500' : 'border-gray-600 bg-smokedark-900'} flex items-center justify-center transition">
                            <i class="fa-solid fa-check text-xs text-white ${isChecked ? '' : 'opacity-0'} transition-opacity"></i>
                        </div>
                        <div>
                            <div class="font-medium text-sm text-gray-200 item-title ${isChecked ? 'line-through text-gray-500' : ''}">${name}</div>
                        </div>
                    </div>
                    <div class="text-right text-xs">
                        ${stackFormatted}
                    </div>
                </div>
            `;
        }

        // 체크 상태 토글
        function toggleCheck(matName, element) {
            checkedState[matName] = !checkedState[matName];
            const isChecked = checkedState[matName];

            if (isChecked) {
                element.classList.add('opacity-40', 'bg-smokedark-900', 'border-gray-900');
                element.querySelector('.check-box').classList.add('bg-rosepink-500', 'border-rosepink-500');
                element.querySelector('.check-box i').classList.remove('opacity-0');
                element.querySelector('.item-title').classList.add('line-through', 'text-gray-500');
            } else {
                element.classList.remove('opacity-40', 'bg-smokedark-900', 'border-gray-900');
                element.querySelector('.check-box').classList.remove('bg-rosepink-500', 'border-rosepink-500');
                element.querySelector('.check-box i').classList.add('opacity-0');
                element.querySelector('.item-title').classList.remove('line-through', 'text-gray-500');
            }
        }

        // 체크 상태 초기화
        function resetCheckmarks() {
            checkedState = {};
            previousQuantities = {};
            if (activeMainTab === 'target') calculateFromTarget();
            else calculateFromStock();
        }

        // 페이지 초기화
        window.onload = function() {
            calculateFromTarget();
        };
    </script>
</body>
</html>
