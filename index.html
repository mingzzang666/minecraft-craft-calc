<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마인크래프트 제작 계산기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosepink: {
                            50: '#fff5f8',
                            100: '#ffe6f0',
                            200: '#fbcfe3',
                            300: '#f7a8ca',
                            400: '#f27ba8',
                            500: '#e83e6b',
                            600: '#d62657',
                        },
                        smokedark: {
                            700: '#3a353b',
                            800: '#2a262d',
                            850: '#221e25',
                            900: '#1b171d',
                            950: '#120f14',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #120f14;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #221e25;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e83e6b;
            border-radius: 3px;
        }
        .tab-btn.active-tab {
            background-color: #e83e6b;
            color: white;
            box-shadow: 0 4px 12px rgba(232, 62, 107, 0.3);
        }
        .card-bg {
            background-color: #1b171d;
            border: 1px solid #2a262d;
        }
        .inner-box {
            background-color: #221e25;
            border: 1px solid #3a353b;
        }
        .input-box {
            background-color: #120f14;
            border: 1px solid #3a353b;
            color: #ffffff;
        }
        .input-box:focus {
            border-color: #e83e6b;
            outline: none;
        }

        /* 커스텀 체크박스 및 호버 카드 스타일 */
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-card:hover {
            transform: translateY(-2px);
            border-color: rgba(232, 62, 107, 0.5);
            box-shadow: 0 4px 14px rgba(232, 62, 107, 0.15);
        }
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.125rem;
            height: 1.125rem;
            border-radius: 0.375rem;
            background-color: #2a262d;
            border: 1px solid #524754;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
            position: relative;
        }
        .custom-checkbox:hover {
            border-color: #f27ba8;
            background-color: #3a353b;
            box-shadow: 0 0 8px rgba(232, 62, 107, 0.4);
        }
        .custom-checkbox::before {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 0.65rem;
            color: white;
            transform: scale(0);
            transition: transform 0.15s ease-in-out;
        }
        .custom-checkbox:checked {
            background-color: #e83e6b;
            border-color: #e83e6b;
            box-shadow: 0 0 10px rgba(232, 62, 107, 0.5);
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen pb-12 custom-scrollbar">
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center text-3xl mb-2 text-rosepink-400">
                <i class="fa-solid fa-cube mr-3"></i>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-rosepink-400">마인크래프트 제작 계산기</h1>
            </div>
            <p class="text-gray-400 text-sm">완성품 수량 기준 또는 보유 핵심 광물 기준으로 재료를 빠르게 계산합니다.</p>
        </header>

        <!-- Mode Selection Tabs -->
        <div class="flex justify-center mb-8 gap-2 bg-smokedark-800 p-1.5 rounded-xl border border-smokedark-700 max-w-md mx-auto">
            <button id="tabTargetBtn" onclick="switchMainTab('target')" class="flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all duration-200 bg-rosepink-500 text-white shadow-md flex items-center justify-center gap-2">
                <i class="fa-solid fa-bullseye"></i> 완성품 제작 수량 기준
            </button>
            <button id="tabStockBtn" onclick="switchMainTab('stock')" class="flex-1 py-2 px-4 rounded-lg font-semibold text-sm transition-all duration-200 text-gray-400 hover:text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-gem"></i> 핵심 광물 보유량 기준
            </button>
        </div>

        <!-- Tab 1: 완성품 기준 입력 -->
        <div id="targetSection" class="space-y-6">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs text-rosepink-300 font-medium">원하는 완성품 제작 수량을 입력하세요.</span>
                <button onclick="resetInputs()" class="bg-smokedark-800 hover:bg-smokedark-700 text-gray-300 hover:text-white px-3 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-rosepink-500/30">
                    <i class="fa-solid fa-rotate-left text-[11px] text-rosepink-400"></i> 입력 수량 초기화
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 라이프스톤 카드 -->
                <div class="card-bg rounded-2xl p-5 border border-rosepink-500/30 shadow-lg shadow-rosepink-950/20">
                    <h2 class="text-base font-bold text-rosepink-300 mb-3 flex items-center gap-2 border-b border-smokedark-700 pb-2">
                        <i class="fa-solid fa-heart-pulse text-rosepink-400"></i> 라이프스톤
                    </h2>
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">하급 라이프스톤</label>
                            <input type="number" id="target_하급 라이프스톤" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">중급 라이프스톤</label>
                            <input type="number" id="target_중급 라이프스톤" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">상급 라이프스톤</label>
                            <input type="number" id="target_상급 라이프스톤" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                    </div>
                </div>

                <!-- 형광 장비 카드 -->
                <div class="card-bg rounded-2xl p-5 border border-rosepink-500/30 shadow-lg shadow-rosepink-950/20">
                    <h2 class="text-base font-bold text-rosepink-300 mb-3 flex items-center gap-2 border-b border-smokedark-700 pb-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-rosepink-400"></i> 형광 장비
                    </h2>
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">오르딘 미니 망치</label>
                            <input type="number" id="target_오르딘 미니 망치" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">루미트 강철 방패</label>
                            <input type="number" id="target_루미트 강철 방패" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">크레온 장인 석궁</label>
                            <input type="number" id="target_크레온 장인 석궁" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">벨릭 사냥 스피어</label>
                            <input type="number" id="target_벨릭 사냥 스피어" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-gray-300 font-medium">세르칸 초승달 단검</label>
                            <input type="number" id="target_세르칸 초승달 단검" min="0" value="0" oninput="calculate()" class="w-20 input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm focus:border-rosepink-400">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 세공품 (일반/탁월한) -->
            <div class="card-bg rounded-2xl p-5 border border-rosepink-500/30 shadow-lg shadow-rosepink-950/20">
                <h2 class="text-base font-bold text-rosepink-300 mb-3 flex items-center gap-2 border-b border-smokedark-700 pb-2">
                    <i class="fa-solid fa-gem text-rosepink-400"></i> 세공품 (일반 / 100 / 탁월한)
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" id="targetJewelryGrid">
                    <!-- Dynamic Target Jewelry Inputs -->
                </div>
            </div>
        </div>

        <!-- Tab 2: 핵심 광물 보유량 기준 입력 -->
        <div id="stockSection" class="space-y-6 hidden">
            <div class="card-bg rounded-2xl p-5 space-y-6">
                <div class="flex items-center justify-between pb-3 border-b border-smokedark-700">
                    <h2 class="text-lg font-bold text-rosepink-400 flex items-center gap-2">
                        <i class="fa-solid fa-gem"></i> 핵심 광물 및 보석 보유 개수
                    </h2>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400 bg-smokedark-900 px-3 py-1 rounded-full border border-smokedark-700 font-medium hidden sm:inline-block">보유 광물/보석 기준 계산</span>
                        <button onclick="resetInputs()" class="bg-smokedark-800 hover:bg-smokedark-700 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-smokedark-700">
                            <i class="fa-solid fa-rotate-left text-[11px]"></i> 입력 수량 초기화
                        </button>
                    </div>
                </div>

                <!-- 라이프스톤 핵심 광물 -->
                <div class="border border-smokedark-700 bg-smokedark-900/50 p-4 rounded-xl relative">
                    <span class="absolute -top-2.5 left-4 px-2 bg-smokedark-800 text-xs font-semibold text-rosepink-400 border border-smokedark-700 rounded">라이프스톤 핵심 광물</span>
                    <div class="grid grid-cols-3 gap-3 pt-1">
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">코룸</label>
                            <input type="number" id="stock_코룸" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">리프톤</label>
                            <input type="number" id="stock_리프톤" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">세렌트</label>
                            <input type="number" id="stock_세렌트" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                    </div>
                </div>

                <!-- 형광 핵심 광물 -->
                <div class="border border-smokedark-700 bg-smokedark-900/50 p-4 rounded-xl relative">
                    <span class="absolute -top-2.5 left-4 px-2 bg-smokedark-800 text-xs font-semibold text-rosepink-400 border border-smokedark-700 rounded">형광 핵심 광물</span>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 pt-1">
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">오르딘</label>
                            <input type="number" id="stock_오르딘" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">루미트</label>
                            <input type="number" id="stock_루미트" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">크레온</label>
                            <input type="number" id="stock_크레온" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">벨릭</label>
                            <input type="number" id="stock_벨릭" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                        <div class="inner-box p-3 rounded-xl sm:col-span-1 col-span-2">
                            <label class="block text-xs font-semibold text-gray-300 mb-1">세르칸</label>
                            <input type="number" id="stock_세르칸" min="0" value="0" oninput="calculate()" class="w-full input-box rounded-lg px-2.5 py-1 text-right font-bold text-sm">
                        </div>
                    </div>
                </div>

                <!-- 세공품 (일반 / 100 / 탁월한) -->
                <div class="border border-smokedark-700 bg-smokedark-900/50 p-4 rounded-xl relative">
                    <span class="absolute -top-2.5 left-4 px-2 bg-smokedark-800 text-xs font-semibold text-rosepink-400 border border-smokedark-700 rounded">세공품 (일반 / 100 / 탁월한)</span>
                    <div class="pt-1">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" id="stockJewelryGrid">
                            <!-- Dynamic Stock Jewelry Inputs -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Card Area -->
        <div id="resultCard" class="mt-8 card-bg rounded-2xl p-5 md:p-6 shadow-2xl transition-all duration-300 hidden">
            
            <!-- 제작 가능 완성품 요약 -->
            <div id="craftSummaryCard" class="mb-6 p-4 bg-smokedark-900 border border-rosepink-500/30 rounded-xl hidden">
                <h3 class="text-xs font-bold text-rosepink-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-hammer"></i> 완성품 제작 가능 수량
                </h3>
                <div id="craftSummaryList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-sm font-medium">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- 결과 헤더 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 pb-3 border-b border-smokedark-700">
                <div>
                    <h2 class="text-xl font-bold text-rosepink-400 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-packing"></i> 필요 나머지 재료 결과
                    </h2>
                    <p class="text-xs text-gray-400 mt-0.5">상자/인벤토리에서 꺼내기 편하게 카테고리별로 정렬된 목록입니다.</p>
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <span class="bg-rosepink-950 text-rosepink-300 border border-rosepink-800/50 px-3 py-1 rounded-full font-medium" id="totalItemsBadge">0종류 재료</span>
                    <button id="resetCheckmarksBtn" onclick="resetCheckmarks()" class="bg-smokedark-900 hover:bg-smokedark-700 text-gray-300 px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-smokedark-700">
                        <i class="fa-solid fa-rotate-left text-[10px]"></i> 체크 초기화
                    </button>
                </div>
            </div>

            <!-- 카테고리 탭 UI -->
            <div class="flex flex-wrap gap-1.5 p-1 bg-smokedark-950 rounded-xl border border-smokedark-700 mb-5" id="categoryTabs">
                <button data-tab="all" onclick="filterCategoryTab('all')" class="tab-btn active-tab flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-list-ul"></i> 전체 보기
                </button>
                <button data-tab="rare" onclick="filterCategoryTab('rare')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-white">
                    <span>💎</span> 귀중 광물
                </button>
                <button data-tab="main" onclick="filterCategoryTab('main')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-white">
                    <span>⛏️</span> 주요 광물/블록
                </button>
                <button data-tab="misc" onclick="filterCategoryTab('misc')" class="tab-btn flex-1 min-w-[90px] py-2 px-3 rounded-lg text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5 text-gray-400 hover:text-white">
                    <span>📦</span> 기타/일반 재료
                </button>
            </div>

            <!-- 결과 그룹 컨테이너 -->
            <div id="resultGroupsContainer" class="space-y-6">
                <!-- JavaScript로 동적 생성됨 -->
            </div>
        </div>

    </div>

    <script>
        // 마인크래프트 조합법 정의 (라이프스톤, 형광 제련품, 세공품 일반/탁월한 포함 정확한 조합식)
        const RECIPES = {
            "하급 라이프스톤": { "조약돌 뭉치": 2, "구리 블록": 8, "레드스톤 블록": 3, "코룸": 1 },
            "중급 라이프스톤": { "심층암 조약돌 뭉치": 2, "청금석 블록": 5, "철 블록": 5, "다이아몬드 블록": 3, "리프톤": 2 },
            "상급 라이프스톤": { "구리 블록": 30, "자수정 블록": 20, "철 블록": 7, "금 블록": 7, "다이아몬드 블록": 5, "세렌트": 3 },
            
            "오르딘 미니 망치": { "오르딘": 1, "사파이어 블록": 1, "스킬 펄스": 1, "다이아몬드": 4, "철 블록": 2, "안산암": 32 },
            "루미트 강철 방패": { "루미트": 1, "토파즈 블록": 1, "스킬 펄스": 1, "꽁꽁 언 얼음": 8, "청금석 블록": 8, "응회암": 32 },

            const rem = qty % 64;
            if (stacks > 0 && rem > 0) {

        function calculate() {
            const resultCard = document.getElementById('resultCard');
            const craftSummaryCard = document.getElementById('craftSummaryCard');
            const craftSummaryList = document.getElementById('craftSummaryList');
            const resultGroupsContainer = document.getElementById('resultGroupsContainer');
            const totalItemsBadge = document.getElementById('totalItemsBadge');

            let totals = {};

            function addRecursive(itemName, count) {
                if (count <= 0) return;
                if (RECIPES[itemName]) {
                    for (let [subMat, subCount] of Object.entries(RECIPES[itemName])) {
                        addRecursive(subMat, subCount * count);
                    }
                } else {
                    totals[itemName] = (totals[itemName] || 0) + count;
                }
            }

            if (currentTab === 'target') {
                craftSummaryCard.classList.add('hidden');

                document.querySelectorAll('input[id^="target_"]').forEach(input => {
                    const itemName = input.id.replace('target_', '');
                    const val = parseInt(input.value) || 0;
                    if (val > 0) {
                        addRecursive(itemName, val);
                    }
                });
            } else {
                craftSummaryCard.classList.remove('hidden');
                let stock = {};
                document.querySelectorAll('input[id^="stock_"]').forEach(input => {
                    stock[input.id.replace('stock_', '')] = parseInt(input.value) || 0;
                });

                let craftableSummary = {};

                // 라이프스톤 핵심광물 계산
                if (stock['코룸'] >= 1) craftableSummary['하급 라이프스톤'] = Math.floor(stock['코룸'] / 1);
                if (stock['리프톤'] >= 2) craftableSummary['중급 라이프스톤'] = Math.floor(stock['리프톤'] / 2);
                if (stock['세렌트'] >= 3) craftableSummary['상급 라이프스톤'] = Math.floor(stock['세렌트'] / 3);

                // 형광 핵심 광물 계산
                const glowMap = [
                    { key: '오르딘', name: '오르딘 미니 망치' },
                    { key: '루미트', name: '루미트 강철 방패' },
                    { key: '크레온', name: '크레온 장인 석궁' },
                    { key: '벨릭', name: '벨릭 사냥 스피어' },
                    { key: '세르칸', name: '세르칸 초승달 단검' }
                ];
                glowMap.forEach(item => {
                    if (stock[item.key] >= 1) {
                        craftableSummary[item.name] = Math.floor(stock[item.key] / 1);
                    }
                });

                // 세공품 보유량 매핑
                uniqueJewelryMeta.forEach(m => {
                    if (stock[m.name] > 0) craftableSummary[m.name] = stock[m.name];
                    if (stock[m.name + ' (100)'] > 0) craftableSummary[m.name + ' (100)'] = stock[m.name + ' (100)'];
                    if (stock['탁월한 ' + m.name] > 0) craftableSummary['탁월한 ' + m.name] = stock['탁월한 ' + m.name];
                });

                // Render Craftable Summary
                if (Object.keys(craftableSummary).length > 0) {
                    craftSummaryList.innerHTML = Object.entries(craftableSummary).map(([item, qty]) => `
                        <div class="inner-box p-2.5 rounded-lg flex justify-between items-center text-xs border border-rosepink-500/20">
                            <span class="text-gray-200 font-semibold">${item}</span>
                            <span class="text-rosepink-300 font-bold">${qty.toLocaleString()}개</span>
                        </div>
                    `).join('');
                } else {
                    craftSummaryList.innerHTML = `<div class="col-span-full text-center text-xs text-gray-400 py-2">제작 가능한 완성품이 없습니다. 광물을 입력해주세요.</div>`;
                }

                // 보유중인 광물 기준 결과 계산 (제작 가능 완성품 수량 기준 정산)
                for (let [craftItem, qty] of Object.entries(craftableSummary)) {
                    if (qty > 0 && RECIPES[craftItem]) {
                        addRecursive(craftItem, qty);
                    }
                }
            }

            if (Object.keys(totals).length === 0) {
                resultCard.classList.add('hidden');
                return;
            }

            resultCard.classList.remove('hidden');

            let groups = {
                rare: { ...CATEGORY_MAP.rare, list: {} },
                main: { ...CATEGORY_MAP.main, list: {} },
                misc: { ...CATEGORY_MAP.misc, list: {} }
            };

            let totalCount = 0;
            for (let [item, qty] of Object.entries(totals)) {
                totalCount++;
                if (CATEGORY_MAP.rare.items.includes(item)) {
                    groups.rare.list[item] = qty;
                } else if (CATEGORY_MAP.main.items.includes(item)) {
                    groups.main.list[item] = qty;
                } else {
                    groups.misc.list[item] = (groups.misc.list[item] || 0) + qty;
                }
            }

            totalItemsBadge.innerText = `${totalCount}종류 재료`;

            // Render Groups
            let htmlContent = '';
            for (let [key, group] of Object.entries(groups)) {
                if (activeCategoryTab !== 'all' && activeCategoryTab !== key) continue;
                const entries = Object.entries(group.list);
                if (entries.length === 0) continue;

                htmlContent += `
                    <div class="inner-box rounded-xl p-4 border border-rosepink-500/20">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-smokedark-700">
                            <h3 class="text-xs font-bold ${group.headerColor} uppercase tracking-wider flex items-center gap-1.5">
                                ${group.title}
                            </h3>
                            <span class="text-[11px] px-2 py-0.5 rounded-full border ${group.badgeColor} font-medium">${entries.length}종류</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                `;

                entries.forEach(([item, qty]) => {
                const currentCheckedMap = currentTab === 'target' ? checkedStateTarget : checkedStateStock;
                const isChecked = currentCheckedMap[item] ? 'checked' : '';
                const lineThrough = isChecked ? 'line-through text-gray-500 opacity-60' : 'text-gray-100 font-medium';
                htmlContent += `
                    <div class="item-card bg-smokedark-900 border ${isChecked ? 'border-smokedark-800 bg-smokedark-950/40 opacity-60' : 'border-smokedark-700'} rounded-xl p-2.5 flex items-center justify-between group cursor-pointer" onclick="handleCardClick(event, '${item}')">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <input type="checkbox" id="chk_${item}" ${isChecked} onchange="toggleCheck('${item}')" onclick="event.stopPropagation()" class="custom-checkbox flex-shrink-0">
                            <label for="chk_${item}" onclick="event.stopPropagation()" class="text-xs cursor-pointer ${lineThrough} truncate group-hover:text-rosepink-200 transition-colors">${item}</label>
                        </div>
                        <span class="text-xs font-bold text-rosepink-300 bg-smokedark-850 group-hover:bg-rosepink-950/40 group-hover:border-rosepink-500/40 px-2.5 py-1 rounded-lg border border-smokedark-700 transition-colors flex-shrink-0 ml-2">
                            ${formatStackText(qty)}
                        </span>
                    </div>
                `;
            });

            htmlContent += `</div></div>`;
        }

        if (!htmlContent) {
            resultGroupsContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm">해당 카테고리에 표시할 재료가 없습니다.</div>`;
        } else {
            resultGroupsContainer.innerHTML = htmlContent;
        }
    }

    function handleCardClick(event, item) {
        // 체크박스 자체나 라벨을 클릭했을 때는 이벤트 중복 발생 방지
        if (event.target.tagName === 'INPUT' || event.target.tagName === 'LABEL') return;
        
        const currentCheckedMap = currentTab === 'target' ? checkedStateTarget : checkedStateStock;
        currentCheckedMap[item] = !currentCheckedMap[item];
        if (!currentCheckedMap[item]) delete currentCheckedMap[item];
        calculate();
    }

    function toggleCheck(item) {
        const chk = document.getElementById(`chk_${item}`);
        const currentCheckedMap = currentTab === 'target' ? checkedStateTarget : checkedStateStock;
        if (chk && chk.checked) {
            currentCheckedMap[item] = true;
        } else {
            delete currentCheckedMap[item];
        }
        calculate();
    }

    window.onload = function() {
        initJewelryInputs();
        calculate();
    };
</script>
</body>
</html>
